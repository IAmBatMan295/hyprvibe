general {
    lock_cmd = pidof madsnake || madsnake
    ignore_dbus_inhibit = false
}

# OLED protection while unlocked: launch madsnake screensaver after 60s idle
listener {
    timeout = 60
    condition_cmd = ! pgrep -x hyprlock >/dev/null
    on-timeout = madsnake
}

# OLED protection while locked: power off panel after 15s idle in hyprlock;
# moving mouse or pressing any key wakes DPMS straight back to hyprlock
listener {
    timeout = 15
    condition_cmd = pgrep -x hyprlock >/dev/null
    condition_retry = 2
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
